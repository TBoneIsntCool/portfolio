<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBone</title>
<link rel="icon" type="image/svg+xml" href="media/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700&family=Josefin+Sans:wght@300;400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="tb">TB</span>one</a>
    <nav>
      <ul class="nav-links" data-nav-links>
        <li><a href="index.html">Home</a></li>
        <li><a href="about-me.html">About Me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" data-nav-toggle aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="page-head">
      <h2>Contact</h2>
      <span class="wave-mark amber"></span>
    </div>
    <div class="contact-grid">
      <div class="haze" style="top:20px; right:-60px; width:280px; height:280px; background:var(--amber); opacity:.08;" aria-hidden="true"></div>
      <div>
        <p class="contact-intro">
          For non personal stuff that is actually important.
        </p>
        <ul class="contact-list">
          <li>
            <span class="k">Discord</span>
            <span class="v">
              tboner_steak
              <button class="copy-btn" type="button" data-copy="tboner_steak">Copy</button>
            </span>
          </li>
          <li>
            <span class="k">Email</span>
            <span class="v">
              contact@tboner.cc
              <button class="copy-btn" type="button" data-copy="contact@tboner.cc">Copy</button>
            </span>
          </li>
        </ul>
      </div>
      <form class="contact-form" data-contact-form>
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <!-- Honeypot: hidden from real visitors, bots tend to fill every field. -->
        <div class="hp-field" aria-hidden="true">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="btn" type="submit">Send message</button>
        <p class="form-status" data-form-status role="status"></p>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>TBone</span>
    <span class="footer-links">
      <a href="index.html">tboner.cc</a>
      <a href="journal.html" class="footer-secret">journal</a>
    </span>
  </div>
</footer>

<script src="js/script.js?v=7"></script>
</body>
</html>
